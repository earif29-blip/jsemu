<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Retro Arcade</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100%; }
        #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        // Securely fetches the zip file as raw binary data to bypass extension header blocks
        async function launchEmulator() {
            try {
                // CHANGE THESE TO YOUR EXACT GITHUB USERNAME AND REPO NAME:
                const romUrl = 'https://github.com/earif29-blip/jsemu/raw/refs/heads/main/POKEMONFR.zip';
                
                const response = await fetch(romUrl);
                const blob = await response.blob();
                const secureGameUrl = URL.createObjectURL(blob);

                // Initialize the emulator settings using the secure Blob URL
                window.EJS_player = '#game';
                window.EJS_core = 'gba'; 
                window.EJS_gameUrl = secureGameUrl; 
                
                window.EJS_pathtodata = 'https://emulatorjs.org';
                window.EJS_pathToData = 'https://emulatorjs.org'; 

                // Dynamically inject the loader script after the game data is securely pre-loaded
                const script = document.createElement('script');
                script.src = 'https://emulatorjs.orgloader.js';
                document.body.appendChild(script);
            } catch (error) {
                console.error("Failed to safely bundle game file:", error);
            }
        }

        launchEmulator();
    </script>
</body>
</html>
