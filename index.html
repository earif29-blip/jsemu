<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Retro Emulator</title>
    <style>
        body { margin: 0; background: #000; }
        #game-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = 'gba'; // Change to your system (e.g., 'nes', 'snes')
        EJS_gameUrl = 'POKEMONFR.gba'; // Must match your uploaded filename exactly
        
        // This links directly to the official cloud files instead of a folder!
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; 
    </script>
    
    <!-- This loads the script directly from the web -->
    <script src="https://emulatorjs.org"></script>
</body>
</html>
